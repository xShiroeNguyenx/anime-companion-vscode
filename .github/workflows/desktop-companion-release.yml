name: Desktop Companion Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Git tag / release tag to publish the Desktop Companion asset to'
        required: true
        default: 'desktop-pet-v1'
      release_title:
        description: 'GitHub release title'
        required: true
        default: 'Desktop Companion v1 (Windows)'
      asset_name:
        description: 'Release asset filename'
        required: true
        default: 'win-x64.zip'
      make_latest:
        description: 'Mark this GitHub release as latest'
        required: true
        default: false
        type: boolean
      prerelease:
        description: 'Mark this GitHub release as a pre-release'
        required: true
        default: false
        type: boolean

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Desktop Companion sidecar
        run: npm run build:desktop-pet

      - name: Pack Desktop Companion asset
        shell: pwsh
        run: |
          $binary = "desktop-pet/target/release/anime-companion-pet.exe"
          if (!(Test-Path $binary)) {
            Write-Error "Expected binary not found: $binary"
            exit 1
          }

          $stageDir = Join-Path $env:RUNNER_TEMP "desktop-companion-win-x64"
          $zipPath = Join-Path $env:GITHUB_WORKSPACE "${{ inputs.asset_name }}"

          Remove-Item -LiteralPath $stageDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $zipPath -Force -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Path $stageDir | Out-Null
          Copy-Item -LiteralPath $binary -Destination (Join-Path $stageDir "anime-companion-pet.exe")
          Compress-Archive -Path (Join-Path $stageDir "*") -DestinationPath $zipPath

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          target_commitish: ${{ github.ref_name }}
          name: ${{ inputs.release_title }}
          files: ${{ inputs.asset_name }}
          make_latest: ${{ inputs.make_latest && 'true' || 'false' }}
          prerelease: ${{ inputs.prerelease }}
