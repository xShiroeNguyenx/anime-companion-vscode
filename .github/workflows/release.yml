name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Build Desktop Companion sidecar
        run: npm run build:desktop-pet

      - name: Verify tag matches package.json version
        shell: pwsh
        run: |
          $pkgVersion = node -p "require('./package.json').version"
          $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
          if ($pkgVersion -ne $tagVersion) {
            Write-Error "Tag $tagVersion does not match package.json version $pkgVersion"
            exit 1
          }

      - name: Package extension
        run: npx vsce package --allow-missing-repository --out anime-companion-${{ github.ref_name }}.vsix

      - name: Publish to Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath anime-companion-${{ github.ref_name }}.vsix

      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish anime-companion-${{ github.ref_name }}.vsix

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: anime-companion-${{ github.ref_name }}.vsix
          generate_release_notes: true
