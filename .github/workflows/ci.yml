name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Type check + compile
        run: npm run compile

      - name: Smoke test
        run: npm test

      - name: Package extension
        run: npx vsce package --allow-missing-repository --out anime-companion.vsix

      - name: Report package size
        shell: bash
        run: |
          ls -lh anime-companion.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: anime-companion-vsix
          path: anime-companion.vsix
          retention-days: 14
